<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>I create // I appreciate</title>
<style>
  :root{ --bg:#f1f1f1; --ink:#0f0f0f; --muted:#8d8d8d; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  html[data-mode="free"], html[data-mode="free"] body{overflow:hidden;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.3 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  nav{position:fixed;top:50%;transform:translateY(-50%);left:0;right:0;z-index:100000;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;pointer-events:none}
  nav .mid{display:flex;gap:32px;align-items:baseline}
  #freedom{justify-self:end;margin-right:calc(var(--gridpad, 10vw) - 2px);pointer-events:auto;cursor:pointer;background:none;border:0;padding:4px 2px;font:inherit;font-size:13px;color:var(--ink)}
  #freedom:hover{text-decoration:underline;text-underline-offset:4px}
  #clear{display:inline-flex;justify-content:center;width:.6em;padding:4px 0;border:0;background:none;font:inherit;color:var(--muted);cursor:default;pointer-events:none;transition:color .2s}
  #clear span{display:inline-block;transition:transform .3s,margin .3s}
  #clear.x{pointer-events:auto;cursor:pointer}
  #clear.x:hover{color:var(--ink)}
  #clear.x span:last-child{margin-left:-.278em;transform:scaleX(-1)}   /* "//" becomes a cross: the second slash flips and overlaps the first */
  .tab{pointer-events:auto;cursor:pointer;background:none;border:0;padding:4px 2px;font:inherit;color:var(--ink);transition:color .2s}
  .tab sup{font-size:9px;margin-left:3px;color:var(--muted);vertical-align:top}
  body[data-filter="do"] .tab[data-tag="see"], body[data-filter="see"] .tab[data-tag="do"]{color:var(--muted)}
  .tab:hover{color:var(--ink) !important}
  .tab.drop{text-decoration:underline}

  footer{position:fixed;left:0;right:0;bottom:0;z-index:100000;display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;pointer-events:none}
  /* menu, logo and small texts: white + difference blend = they invert whatever is underneath */
  nav,footer,#tools{mix-blend-mode:difference;--ink:#e2e2e2;--muted:#646464}   /* #e2e2e2 on #f1f1f1 → #0f0f0f */
  footer img{filter:invert(1) brightness(.886);width:55px;height:auto;display:block;user-select:none;-webkit-user-drag:none}
  #stage{position:absolute;top:0;left:0;width:100%}
  html[data-mode="free"] #stage{position:fixed;inset:0;height:auto !important}
  .card{position:absolute;width:90px;margin:0;transition:opacity .3s,filter .3s,left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1);cursor:default;user-select:none;animation:pop .3s both}
  html[data-mode="free"] .card{cursor:grab;touch-action:none}
  .booting .card{transition:none !important;animation:none !important}
  @keyframes pop{from{opacity:0}}
  .card.dragging{transition:opacity .3s,filter .3s;cursor:grabbing;z-index:99990 !important}
  .card img{display:block;width:100%;height:auto;max-height:130px;object-fit:cover;pointer-events:none}
  .card .t{display:block;width:100%;margin-top:4px;padding:2px 0;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;font:inherit;font-size:11px;color:var(--ink);cursor:text;user-select:text}
  .card .t{text-overflow:ellipsis}
  .card .t::placeholder{color:#555;opacity:1}
  .card .t:focus{border-bottom-color:var(--ink)}
  .card .tg,.card .x{position:absolute;top:0;border:0;cursor:pointer;background:var(--bg);color:var(--ink);font:inherit;font-size:9px;line-height:1;padding:3px 5px;opacity:0;transition:opacity .2s}
  .card .tg{left:0}
  .card .x{right:0;font-size:12px}
  .card:hover .tg,.card:hover .x,.card:focus-within .tg,.card:focus-within .x{opacity:1}

  body[data-filter="do"]  .card:not([data-tag="do"]),
  body[data-filter="see"] .card:not([data-tag="see"]){opacity:0;pointer-events:none}
  body[data-hover="do"]  .card:not([data-tag="do"]),
  body[data-hover="see"] .card:not([data-tag="see"]){opacity:.15;pointer-events:none}
  body[data-hover="do"]  .card[data-tag="do"],
  body[data-hover="see"] .card[data-tag="see"]{opacity:1;pointer-events:none}

  #tools{position:fixed;right:18px;bottom:14px;z-index:100000;display:flex;gap:18px}
  #tools button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;transition:color .2s}
  #tools button:hover,#tools button.on{color:var(--ink)}
  #tools button.on{text-decoration:underline;text-underline-offset:4px}
  #tools [hidden]{display:none}
  #shuffle-wrap{display:none;align-items:center;gap:8px}
  html[data-mode="free"] #shuffle-wrap{display:inline-flex}
  #tools #shuffle-auto{position:relative;width:24px;height:13px;border:1px solid var(--muted);border-radius:13px;transition:border-color .2s,background .2s}
  #shuffle-auto::after{content:"";position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
  #tools #shuffle-auto:hover{border-color:var(--ink)}
  #tools #shuffle-auto.on{border-color:var(--ink);background:var(--ink)}
  #shuffle-auto.on::after{transform:translateX(11px);background:var(--bg)}
  #veil{position:fixed;inset:12px;z-index:99998;border:1px dashed var(--ink);pointer-events:none;opacity:0;transition:opacity .15s}
  body.filedrag #veil{opacity:1}

  /* ---------- text notes: click on empty space and write ---------- */
  .card .note{width:90px;max-height:120px;background:var(--bg);border:1px solid #cfcfcf;padding:7px;font-size:8px;line-height:1.25;color:var(--ink);white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;pointer-events:none}
  html{cursor:text}
  nav button,#tools button,#add,html[data-mode="grid"] .card{cursor:pointer}
  /* writing: no box at all, just the words where you clicked */
  #editor{position:fixed;z-index:100001;display:none}
  #editor.open{display:block}
  #editor textarea{display:block;margin:0;padding:0;border:0;outline:0;background:none;resize:none;overflow:hidden;font:inherit;font-size:18px;line-height:1.3;color:var(--ink);caret-color:var(--ink)}
  #editor .ex{display:none}

  /* ---------- add button + phones/tablets ---------- */
  #add{display:none;position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));width:48px;height:48px;padding:0;border:1.5px solid #e2e2e2;border-radius:50%;background:none;cursor:pointer;z-index:100000;mix-blend-mode:difference;place-items:center}
  #add svg{width:18px;height:18px;display:block}
  .card.sel .tg,.card.sel .x{opacity:1}
  @media (max-width:900px), (hover:none){
    #add{display:grid}
    nav{grid-template-columns:1fr;justify-items:center;row-gap:8px}
    nav > span{display:none}
    nav .mid{gap:14px}
    #freedom{justify-self:center;margin-right:0}
    footer{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    #tools{right:auto;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));flex-direction:column;align-items:flex-start;gap:8px}
    .card .tg,.card .x{padding:8px 10px;font-size:11px}
    .card .x{font-size:15px;padding:5px 10px}
  }
</style>
</head>
<body>

<nav>
  <span></span>
  <div class="mid">
    <button class="tab" data-tag="do">I create<sup></sup></button>
    <button id="clear" tabindex="-1" aria-label="show everything"><span>/</span><span>/</span></button>
    <button class="tab" data-tag="see">I appreciate<sup></sup></button>
  </div>
  <button id="freedom" title="line the pictures up in a grid">organize</button>
</nav>
<input id="file" type="file" accept="image/*" multiple hidden>
<button id="add" aria-label="add pictures"><svg viewBox="0 0 18 18" fill="none" stroke="#e2e2e2" stroke-width="1.6"><path d="M9 1v16M1 9h16"/></svg></button>
<footer><img src="images/logo.svg" alt="logo" draggable="false"></footer>

<div id="stage"></div>
<div id="veil"></div>
<div id="editor"><textarea spellcheck="true" placeholder=""></textarea><button class="ex" title="bigger / smaller" aria-label="bigger or smaller"><svg viewBox="0 0 18 18" fill="none" stroke="#3d3b3b" stroke-width="1.4"><path d="M1 5V1h4M13 1h4v4M17 13v4h-4M5 17H1v-4"/></svg></button></div>
<div id="tools">
  <button id="sort-added" title="newest added first">date added</button>
  <button id="sort-created" title="by the date in the picture's metadata" hidden>date created</button>
  <span id="shuffle-wrap"><button id="shuffle" title="scatter everything again">shuffle</button><button id="shuffle-auto" role="switch" aria-checked="false" aria-label="shuffle on every reload" title="shuffle on every reload"></button></span>
</div>

<script>
(() => {
  const CW = 90, PAD = 24, BOT = 110, EST_H = 140;
  const CARDH = 156, TOP = 48, SAFE = 48, NAVH = 30, BAND = NAVH + 2 * SAFE;   // SAFE = clear space above and below the tabs row
  const setTop = () => {};
  // free mode: the tabs row sits in the middle of the screen; cards live above or below it, never on it
  function zones(h) {
    const C = innerHeight / 2;
    const Lu = Math.max(0, C - BAND / 2 - h - TOP), Ll = Math.max(0, innerHeight - BOT - h - (C + BAND / 2));
    return { C, Lu, Ll };
  }
  function yToTop(y, h) {
    const { C, Lu, Ll } = zones(h), v = y * (Lu + Ll);
    return v <= Lu ? TOP + v : C + BAND / 2 + (v - Lu);
  }
  const span = h => Math.max(1, innerHeight - TOP - BOT - h);   // free mode: a card can go anywhere, also over the menu
  setTop();
  const stage = document.getElementById('stage');
  const tabs = [...document.querySelectorAll('.tab')];
  let items = [], filter = null, zTop = 1, mode = 'free', sortBy = 'added';
  const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem('pref-' + k); localStorage.setItem('pref-' + k, v); } catch {} };
  if (pref('mode') === 'grid') mode = 'grid';
  if (pref('sort') === 'created') sortBy = 'created';
  document.documentElement.dataset.mode = mode;
  const els = new Map();

  /* ---------- storage (IndexedDB, so images survive reloads) ---------- */
  const dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ido-isee', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  const tx = async (mode, fn) => {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction('items', mode);
      const out = fn(t.objectStore('items'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    });
  };
  const save = it => tx('readwrite', s => s.put(it)).catch(() => {});
  const remove = id => tx('readwrite', s => s.delete(id)).catch(() => {});

  /* ---------- helpers ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // best-candidate scatter: pick the free-est spot so cards overlap as little as possible
  function spot(others) {
    const W = Math.max(1, innerWidth - 2 * PAD - CW), H = Math.max(1, innerHeight - TOP - BOT - EST_H);
    const C = innerHeight / 2;
    let best = { x: Math.random(), y: 0 }, bd = -1;
    for (let k = 0; k < 120; k++) {
      const c = { x: Math.random(), y: Math.random() };
      const top = TOP + c.y * span(CARDH);                       // random spots keep clear of the menu
      if (top + CARDH > C - BAND / 2 && top < C + BAND / 2) continue;
      let d = Infinity;
      for (const o of others) d = Math.min(d, Math.max(Math.abs(c.x - o.x) * W / (CW + 14), Math.abs(c.y - o.y) * H / (EST_H + 26)));
      if (d > bd) { bd = d; best = c; }
    }
    return best;
  }

  function place(el, it) {
    if (mode === 'grid') {
      if (it._gx == null) return;
      el.style.left = it._gx + 'px'; el.style.top = it._gy + 'px';
      return;
    }
    const W = innerWidth, H = innerHeight, h = CARDH;
    el.style.left = PAD + it.x * Math.max(0, W - 2 * PAD - CW) + 'px';
    el.style.top = TOP + it.y * span(h) + 'px';
  }

  // grid mode: an invisible grid, newest first; hidden (filtered-out) cards leave it and the rest close up
  // the freedom/organize button lines up with the right edge of the grid
  function setGridPad() {
    const W = innerWidth, gap = W < 700 ? 24 : 60, pitch = CW + gap;
    const cols = Math.max(1, Math.floor((W - 2 * PAD + gap) / pitch));
    document.documentElement.style.setProperty('--gridpad', (W - (cols * pitch - gap)) / 2 + 'px');
  }
  setGridPad();

  function layout() {
    setTop(); setGridPad();
    if (mode === 'free') { stage.style.height = ''; items.forEach(it => place(els.get(it.id), it)); return; }
    const W = innerWidth, GAPX = W < 700 ? 24 : 60, pitchX = CW + GAPX, pitchY = 190;
    const cols = Math.max(1, Math.floor((W - 2 * PAD + GAPX) / pitchX));
    const left0 = (W - (cols * pitchX - GAPX)) / 2;
    const key = it => sortBy === 'created' ? (it.c || 0) : (it.t || 0);
    const sorted = [...items].sort((a, b) => key(b) - key(a) || (b.t || 0) - (a.t || 0));
    const vis = sorted.filter(i => !filter || i.tag === filter);
    // the tabs row stays in the middle of the screen: rows above it and below it, SAFE clear space on both sides
    const rows = Math.ceil(vis.length / cols), CARDMAX = 156, C = innerHeight / 2;
    const cap = Math.max(1, Math.floor((C - BAND / 2 - TOP - CARDMAX) / pitchY) + 1);
    const upper = Math.min(cap, Math.ceil(rows / 2));
    const upperBottomY = C - BAND / 2 - CARDMAX;          // top of the row just above the tabs
    const lowerY0 = C + BAND / 2;
    sorted.forEach(it => {
      const k = Math.max(0, vis.indexOf(it)), r = Math.floor(k / cols);
      it._gx = left0 + (k % cols) * pitchX;
      it._gy = r < upper ? upperBottomY - (upper - 1 - r) * pitchY : lowerY0 + (r - upper) * pitchY;
      place(els.get(it.id), it);
    });
    stage.style.height = Math.max(innerHeight, (rows > upper ? lowerY0 + (rows - upper - 1) * pitchY + CARDMAX : 0) + BOT) + 'px';
  }

  function refresh() {
    document.body.classList.toggle('has-items', items.length > 0);
    document.body.dataset.filter = filter || '';
    tabs.forEach(t => {
      t.classList.toggle('active', t.dataset.tag === filter);
      t.querySelector('sup').textContent = items.filter(i => i.tag === t.dataset.tag).length;
    });
    document.getElementById('sort-created').hidden = !items.some(i => i.c);
    document.getElementById('clear').classList.toggle('x', !!filter);
    layout();
    document.getElementById('sort-added').classList.toggle('on', mode === 'grid' && sortBy === 'added');
    document.getElementById('sort-created').classList.toggle('on', mode === 'grid' && sortBy === 'created');
  }

  /* ---------- cards ---------- */
  function makeCard(it, focus) {
    const el = document.createElement('figure');
    el.className = 'card';
    el.dataset.tag = it.tag;
    el.style.setProperty('--r', it.rot + 'deg');
    el.style.zIndex = it.z;

    const x = Object.assign(document.createElement('button'), { className: 'x', textContent: '×', title: 'remove' });
    const tg = Object.assign(document.createElement('button'), { className: 'tg', title: 'switch create / appreciate' });
    const label = () => tg.textContent = it.tag === 'do' ? 'create' : 'appreciate';
    label();
    let url = null, inp = null;
    if (it.kind === 'note') {
      // a text note: a small box with the words inside
      const box = Object.assign(document.createElement('div'), { className: 'note', textContent: it.text || '' });
      el.classList.add('is-note');
      el.append(x, tg, box);
    } else {
      const img = document.createElement('img'); img.alt = ''; img.draggable = false;
      url = it.src || URL.createObjectURL(it.blob);
      img.src = url;
      if (it.ar) img.style.aspectRatio = it.ar;
      img.onload = () => { if (!it.ar && img.naturalHeight) { it.ar = +(img.naturalWidth / img.naturalHeight).toFixed(4); save(it); } place(el, it); };
      inp = Object.assign(document.createElement('input'), { className: 't', placeholder: it.name || 'untitled', maxLength: 60, value: it.title || '' });
      el.append(x, tg, img, inp);
      inp.addEventListener('input', () => { it.title = inp.value; save(it); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    }
    el._url = url;

    tg.addEventListener('click', e => {
      e.stopPropagation();
      it.tag = it.tag === 'do' ? 'see' : 'do';
      el.dataset.tag = it.tag; label(); save(it); refresh();
    });
    x.addEventListener('click', e => { e.stopPropagation(); removeCard(it); });

    // move the card around
    el.addEventListener('pointerdown', e => {
      if (mode !== 'free' || e.target.closest('input,button')) return;
      e.preventDefault();
      el._moved = false;
      const r = el.getBoundingClientRect();
      const gx = e.clientX - r.left, gy = e.clientY - r.top;
      it.z = ++zTop; el.style.zIndex = it.z;
      el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
      const move = ev => {
        const W = innerWidth, H = innerHeight, h = CARDH;
        if (Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) > 6) el._moved = true;
        it.x = clamp((ev.clientX - gx - PAD) / Math.max(1, W - 2 * PAD - CW));
        it.y = clamp((ev.clientY - gy - TOP) / span(h));
        place(el, it);
      };
      const up = () => {
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        save(it);
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    // touch screens have no hover: a tap on a card shows its tag / remove buttons
    el.addEventListener('click', e => {
      if (e.target.closest('input,button')) return;
      if (el._moved) { el._moved = false; return; }
      const touch = matchMedia('(hover: none)').matches;
      // a note opens for writing on click (on touch: first tap shows its buttons, the next tap opens it)
      if (it.kind === 'note' && (!touch || el.classList.contains('sel'))) {
        el.classList.remove('sel');
        const r = el.getBoundingClientRect();
        openEditor(it, r.left + NOTE_IN, r.top + NOTE_IN);
        return;
      }
      if (!touch) return;
      const was = el.classList.contains('sel');
      document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
      if (!was) el.classList.add('sel');
    });

    stage.appendChild(el);
    els.set(it.id, el);
    place(el, it);
    if (focus && inp) setTimeout(() => inp.focus(), 60);   // title input right under the new image
    return el;
  }

  function removeCard(it) {
    const el = els.get(it.id);
    if (!el) return;
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = 0; el.style.transform = 'scale(.5)';
    setTimeout(() => {
      el.remove(); if (el._url && !it.src) URL.revokeObjectURL(el._url); els.delete(it.id);
      items = items.filter(i => i !== it); remove(it.id); refresh();
    }, 200);
  }

  /* ---------- text notes: click on empty space, write, click away = it becomes a small box ---------- */
  const editor = document.getElementById('editor'), ta = editor.querySelector('textarea');
  let editing = null, editPt = null;
  const NOTE_IN = 8, LINE = 18 * 1.3;   // note box: 1px border + 7px padding; one written line is 23.4px tall
  const isOpen = () => editor.classList.contains('open');
  function openEditor(it, x, y) {
    editing = it; editPt = { x, y };
    ta.value = it ? it.text || '' : '';
    editor.classList.add('open');
    // the text starts exactly at (x, y): nothing is shifted; near the right edge the lines just wrap sooner
    ta.style.width = Math.max(60, Math.min(320, innerWidth - x - 8)) + 'px';
    editor.style.left = x + 'px';
    editor.style.top = y + 'px';
    grow();
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  function closeEditor() {
    if (!isOpen()) return;
    editor.classList.remove('open');
    ta.blur();
    const text = ta.value.replace(/\s+$/, '');
    if (editing) {
      if (!text.trim()) removeCard(editing);
      else if (text !== editing.text) {
        editing.text = text; save(editing);
        const box = els.get(editing.id)?.querySelector('.note');
        if (box) box.textContent = text;
      }
    } else if (text.trim()) {
      const it = { id: crypto.randomUUID(), kind: 'note', text, tag: filter || 'do', t: Date.now(), title: '', name: '', rot: 0, z: ++zTop, ...spot(items) };
      if (mode === 'free') {   // the box forms around the words, where they were written
        it.x = clamp((editPt.x - NOTE_IN - PAD) / Math.max(1, innerWidth - 2 * PAD - CW));
        it.y = clamp((editPt.y - NOTE_IN - TOP) / span(CARDH));
      }
      items.push(it); save(it); makeCard(it); refresh();
    }
    editing = null;
  }
  function grow() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); closeEditor(); }
  });
  // clicking outside the box closes it; that same click doesn't start a new note
  let skipClick = false;
  document.addEventListener('pointerdown', e => {
    skipClick = isOpen() || !!document.querySelector('.card.sel');
    if (isOpen() && !editor.contains(e.target)) closeEditor();
  }, true);
  document.addEventListener('click', e => {
    if (skipClick) return;
    if (![document.documentElement, document.body, stage].includes(e.target)) return;
    if (getSelection().toString()) return;
    openEditor(null, e.clientX, e.clientY - LINE / 2);   // the caret's middle sits on the click
  });

  /* ---------- adding pictures ---------- */
  async function shrink(f) {
    if (/gif|svg/.test(f.type)) return f;
    try {
      const bmp = await createImageBitmap(f);
      const s = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || f), 'image/jpeg', .88));
    } catch { return f; }
  }

  // date the picture was taken: EXIF (JPEG) first, else the file's own date
  async function exifDate(f) {
    try {
      if (!/jpe?g/i.test(f.type)) return null;
      const v = new DataView(await f.slice(0, 131072).arrayBuffer());
      if (v.getUint16(0) !== 0xFFD8) return null;
      for (let o = 2; o < v.byteLength - 4;) {
        const m = v.getUint16(o), len = v.getUint16(o + 2);
        if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          const t = o + 10, le = v.getUint16(t) === 0x4949;
          const u16 = q => v.getUint16(q, le), u32 = q => v.getUint32(q, le);
          const find = (q, want) => { const n = u16(q); for (let i = 0; i < n; i++) { const e = q + 2 + i * 12; if (u16(e) === want) return e; } return null; };
          const ifd0 = t + u32(t + 4);
          let tag = null;
          const ex = find(ifd0, 0x8769);
          if (ex) { const sub = t + u32(ex + 8); tag = find(sub, 0x9003) || find(sub, 0x9004); }
          if (!tag) tag = find(ifd0, 0x0132);
          if (!tag) return null;
          let str = ''; const at = t + u32(tag + 8);
          for (let i = 0; i < 19; i++) str += String.fromCharCode(v.getUint8(at + i));
          const d = str.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
          return d ? new Date(+d[1], d[2] - 1, +d[3], +d[4], +d[5], +d[6]).getTime() : null;
        }
        if (m === 0xFFDA) break;
        o += 2 + len;
      }
    } catch {}
    return null;
  }

  async function addFiles(files, tag, pt) {
    const imgs = [...files].filter(f => f.type.startsWith('image/'));
    for (let i = 0; i < imgs.length; i++) {
      const created = (await exifDate(imgs[i])) || imgs[i].lastModified || null;
      const blob = await shrink(imgs[i]);
      const it = { id: crypto.randomUUID(), tag, t: Date.now() + i, c: created, title: '', name: imgs[i].name.replace(/\.[^.]+$/, ''), blob, rot: 0, z: ++zTop, ...spot(items) };
      if (pt && i === 0) {
        it.x = clamp((pt.x - CW / 2 - PAD) / Math.max(1, innerWidth - 2 * PAD - CW));
        it.y = clamp((pt.y - 60 - TOP) / span(EST_H));
      }
      items.push(it); save(it);
      makeCard(it, i === imgs.length - 1);
    }
    refresh();
  }

  /* ---------- tabs: hover = preview, click = filter, drop = tag ---------- */
  tabs.forEach(t => {
    const tag = t.dataset.tag;
    t.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') document.body.dataset.hover = tag; });
    t.addEventListener('pointerleave', () => document.body.dataset.hover = '');
    t.addEventListener('focus', () => { if (t.matches(':focus-visible')) document.body.dataset.hover = tag; });
    t.addEventListener('blur', () => document.body.dataset.hover = '');
    t.addEventListener('click', () => { filter = filter === tag ? null : tag; refresh(); });
    t.addEventListener('dragenter', () => t.classList.add('drop'));
    t.addEventListener('dragleave', () => t.classList.remove('drop'));
    t.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); t.classList.remove('drop');
      document.body.classList.remove('filedrag');
      addFiles(e.dataTransfer.files, tag, null);
    });
  });

  /* ---------- drag & drop anywhere ---------- */
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); document.body.classList.add('filedrag'); } });
  addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('filedrag'); });
  addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); document.body.classList.remove('filedrag');
    addFiles(e.dataTransfer.files, filter || 'do', { x: e.clientX, y: e.clientY });
  });
  addEventListener('paste', e => {
    const fs = [...(e.clipboardData?.files || [])];
    if (fs.length) addFiles(fs, filter || 'do', null);
  });

  /* ---------- shuffle + resize ---------- */
  function shuffleAll(animate) {
    const placed = [];
    items.forEach(it => {
      Object.assign(it, spot(placed)); placed.push(it);
      const el = els.get(it.id);
      if (animate) el.style.transition = 'left .6s cubic-bezier(.2,.9,.3,1), top .6s cubic-bezier(.2,.9,.3,1), transform .35s';
      place(el, it); save(it);
      if (animate) setTimeout(() => el.style.transition = '', 700);
    });
  }
  document.getElementById('shuffle').addEventListener('click', () => shuffleAll(true));
  // little toggle: when on, the pictures are scattered anew every time the page loads
  const autoBtn = document.getElementById('shuffle-auto');
  const showAuto = () => { const on = pref('autoshuffle') === '1'; autoBtn.classList.toggle('on', on); autoBtn.setAttribute('aria-checked', on); };
  showAuto();
  autoBtn.addEventListener('click', () => { pref('autoshuffle', pref('autoshuffle') === '1' ? '0' : '1'); showAuto(); });
  addEventListener('resize', layout);
  document.getElementById('clear').addEventListener('click', () => { filter = null; refresh(); });
  const fileIn = document.getElementById('file');
  document.getElementById('add').addEventListener('click', () => fileIn.click());
  fileIn.addEventListener('change', () => { addFiles(fileIn.files, filter || 'do', null); fileIn.value = ''; });
  document.addEventListener('click', e => { if (!e.target.closest('.card')) document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); });
  const modeBtn = document.getElementById('freedom');
  function setMode(m) {
    mode = m; pref('mode', m); pref('sort', sortBy);
    document.documentElement.dataset.mode = mode;
    modeBtn.textContent = mode === 'free' ? 'organize' : 'freedom';
    modeBtn.title = mode === 'free' ? 'line the pictures up in a grid' : 'scatter the pictures and move them around';
    scrollTo(0, 0);
    refresh();
  }
  modeBtn.textContent = mode === 'free' ? 'organize' : 'freedom';
  modeBtn.addEventListener('click', () => setMode(mode === 'free' ? 'grid' : 'free'));
  // sorting arranges the grid, so choosing an order lines everything up
  [['sort-added', 'added'], ['sort-created', 'created']].forEach(([id, by]) => {
    document.getElementById(id).addEventListener('click', () => { sortBy = by; setMode('grid'); });
  });

  /* ---------- starter pictures ---------- */
  const SEED = [
    ['terrain','do'],['blue-wall','see'],['video-call','see'],['brukxt-posters','do'],
    ['brukxt-logo','do'],['exhibition','see'],['projection','see'],['dj-set','see'],
    ['blue-clouds','do'],['blue-noise-1','do'],['blue-noise-2','do'],['tree','see']
  ];
  const seedBase = Date.now();
  function seed() {
    try { if (localStorage.getItem('seeded-v1')) return; localStorage.setItem('seeded-v1', '1'); } catch { return; }
    SEED.forEach(([name, tag]) => {
      const it = { id: 'seed-' + name, t: seedBase - SEED.findIndex(x => x[0] === name) * 1000, tag, title: '', name, src: 'images/' + name + '.webp', rot: 0, z: ++zTop, ...spot(items) };
      items.push(it); save(it); makeCard(it);
    });
  }

  /* ---------- load ---------- */
  dbp.then(() => tx('readonly', s => s.getAll())).then(all => {
    items = all || [];
    if (!pref('ymap2')) {   // positions used to skip the menu band; convert them to the plain mapping once
      items.forEach(it => { it.y = clamp((yToTop(it.y, CARDH) - TOP) / span(CARDH)); save(it); });
      pref('ymap2', '1');
    }
    items.forEach(it => { zTop = Math.max(zTop, it.z || 1); makeCard(it); });
    seed();
    if (pref('autoshuffle') === '1') shuffleAll(false);
    refresh();
  }).catch(() => { seed(); refresh(); }).finally(() => requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('booting'))));
})();
</script>
</body>
</html>
